<svg xmlns="http://www.w3.org/2000/svg" width="420" height="215" viewBox="470 327 420 215">
<style>
    .title{font:800 28px Arial,Helvetica,sans-serif;fill:#171b21}
    .project{font:800 18px Arial,Helvetica,sans-serif;fill:#20252c}
    .desc{font:400 14px Arial,Helvetica,sans-serif;fill:#69737e}
    .focus{font:700 13px Arial,Helvetica,sans-serif;fill:#6942c1}
    .num{font:800 12px Arial,Helvetica,sans-serif;fill:#8a939d}
    .card{fill:#fff;stroke:#e1e5ea;stroke-width:1.5}
    .tag{fill:#f5f7fa;stroke:#e2e6eb;stroke-width:1}
    .tagtext{font:700 11px Arial,Helvetica,sans-serif;fill:#59636e}
.preview{fill:#fff;stroke:#2f81f7;stroke-width:1.4}
.previewtext{font:700 11px Arial,Helvetica,sans-serif;fill:#2f81f7}
    .accent{fill:url(#accent)}
    @media (prefers-color-scheme:dark){
      .title,.project{fill:#f0f6fc}
      .desc{fill:#8b949e}
      .focus{fill:#58a6ff}
      .num{fill:#6e7681}
      .card{fill:#161b22;stroke:#30363d}
      .tag{fill:#1c2128;stroke:#30363d}
      .tagtext{fill:#8b949e}
.preview{fill:#161b22;stroke:#58a6ff}
.previewtext{fill:#58a6ff}
    }
  </style>
<!-- 04 -->
<rect x="470" y="327" width="420" height="215" rx="18" class="card"/>
<text x="495" y="361" class="num">04</text>
<text x="530" y="361" class="project">🚀 DevTextHub</text>
<text x="495" y="397" class="desc">Project Management Hub for organizing projects,</text>
<text x="495" y="419" class="desc">tasks and development workflows.</text>
<rect x="495" y="452" width="91" height="30" rx="15" class="tag"/>
<text x="510" y="471" class="tagtext">PostgreSQL</text>
<rect x="594.0" y="452" width="77" height="30" rx="15" class="tag"/>
<text x="609" y="471" class="tagtext">Firebase</text>
<rect x="678.8" y="452" width="105" height="30" rx="15" class="tag"/>
<text x="694" y="471" class="tagtext">Tailwind CSS</text>
<rect x="495" y="490" width="70" height="30" rx="15" class="tag"/>
<text x="510" y="509" class="tagtext">Next.js</text>
<rect x="750" y="500" width="128" height="30" rx="15" class="preview"/>
<text x="766" y="519" class="previewtext">Coming Soon</text>

</svg>