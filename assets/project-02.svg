<svg xmlns="http://www.w3.org/2000/svg" width="420" height="215" viewBox="470 92 420 215">
<style>
    .title{font:800 28px Arial,Helvetica,sans-serif;fill:#171b21}
    .project{font:800 18px Arial,Helvetica,sans-serif;fill:#20252c}
    .desc{font:400 14px Arial,Helvetica,sans-serif;fill:#69737e}
    .focus{font:700 13px Arial,Helvetica,sans-serif;fill:#6942c1}
    .num{font:800 12px Arial,Helvetica,sans-serif;fill:#8a939d}
    .card{fill:#fff;stroke:#e1e5ea;stroke-width:1.5}
    .tag{fill:#f5f7fa;stroke:#e2e6eb;stroke-width:1}
    .tagtext{font:700 11px Arial,Helvetica,sans-serif;fill:#59636e}
.preview{fill:#fff;stroke:#2f81f7;stroke-width:1.4}
.previewtext{font:700 11px Arial,Helvetica,sans-serif;fill:#2f81f7}
    .accent{fill:url(#accent)}
    @media (prefers-color-scheme:dark){
      .title,.project{fill:#f0f6fc}
      .desc{fill:#8b949e}
      .focus{fill:#58a6ff}
      .num{fill:#6e7681}
      .card{fill:#161b22;stroke:#30363d}
      .tag{fill:#1c2128;stroke:#30363d}
      .tagtext{fill:#8b949e}
.preview{fill:#161b22;stroke:#58a6ff}
.previewtext{fill:#58a6ff}
    }
  </style>
<!-- 02 -->
<rect x="470" y="92" width="420" height="215" rx="18" class="card"/>
<text x="495" y="126" class="num">02</text>
<text x="530" y="126" class="project">📍 Nearby Places</text>
<text x="495" y="162" class="desc">A project focused on discovering and working with</text>
<text x="495" y="184" class="desc">nearby locations and places.</text>
<rect x="495" y="217" width="119" height="30" rx="15" class="tag"/>
<text x="510" y="236" class="tagtext">Android Studio</text>
<rect x="622.4" y="217" width="70" height="30" rx="15" class="tag"/>
<text x="637" y="236" class="tagtext">Java</text>
<rect x="700.4" y="217" width="70" height="30" rx="15" class="tag"/>
<text x="715" y="236" class="tagtext">SQL</text>
<rect x="786" y="265" width="92" height="30" rx="15" class="preview"/>
  <text x="802" y="284" class="previewtext">↗ GitHub</text>


</svg>