<svg xmlns="http://www.w3.org/2000/svg" width="420" height="215" viewBox="30 327 420 215">
<style>
    .title{font:800 28px Arial,Helvetica,sans-serif;fill:#171b21}
    .project{font:800 18px Arial,Helvetica,sans-serif;fill:#20252c}
    .desc{font:400 14px Arial,Helvetica,sans-serif;fill:#69737e}
    .focus{font:700 13px Arial,Helvetica,sans-serif;fill:#6942c1}
    .num{font:800 12px Arial,Helvetica,sans-serif;fill:#8a939d}
    .card{fill:#fff;stroke:#e1e5ea;stroke-width:1.5}
    .tag{fill:#f5f7fa;stroke:#e2e6eb;stroke-width:1}
    .tagtext{font:700 11px Arial,Helvetica,sans-serif;fill:#59636e}
.preview{fill:#fff;stroke:#2f81f7;stroke-width:1.4}
.previewtext{font:700 11px Arial,Helvetica,sans-serif;fill:#2f81f7}
    .accent{fill:url(#accent)}
    @media (prefers-color-scheme:dark){
      .title,.project{fill:#f0f6fc}
      .desc{fill:#8b949e}
      .focus{fill:#58a6ff}
      .num{fill:#6e7681}
      .card{fill:#161b22;stroke:#30363d}
      .tag{fill:#1c2128;stroke:#30363d}
      .tagtext{fill:#8b949e}
.preview{fill:#161b22;stroke:#58a6ff}
.previewtext{fill:#58a6ff}
    }
  </style>
<!-- 03 -->
<rect x="30" y="327" width="420" height="215" rx="18" class="card"/>
<text x="55" y="361" class="num">03</text>
<text x="90" y="361" class="project">🎨 Figma File JSON Downloader</text>
<text x="55" y="397" class="desc">A utility project for working with Figma file data</text>
<text x="55" y="419" class="desc">and JSON.</text>
<rect x="55" y="452" width="70" height="30" rx="15" class="tag"/>
<text x="70" y="471" class="tagtext">HTML</text>
<rect x="133" y="452" width="70" height="30" rx="15" class="tag"/>
<text x="148" y="471" class="tagtext">CSS</text>
<rect x="211" y="452" width="70" height="30" rx="15" class="tag"/>
<text x="226" y="471" class="tagtext">Fastly</text>
<rect x="55" y="490" width="70" height="30" rx="15" class="tag"/>
<text x="70" y="509" class="tagtext">Varnish</text>
<rect x="326" y="500" width="112" height="30" rx="15" class="preview"/>
  <text x="342" y="519" class="previewtext">↗ View Live</text>


</svg>