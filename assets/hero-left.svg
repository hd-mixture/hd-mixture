<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title>Darshan Prajapati — Developer and Designer</title>
<desc>Minimal animated portfolio introduction with an ultra-compact role badge.</desc>

<defs>
  <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6942c1"/>
    <stop offset="100%" stop-color="#2f81f7"/>
  </linearGradient>
</defs>

<style>
  .eyebrow{font:700 18px Arial,Helvetica,sans-serif;letter-spacing:5px;fill:#4b4f55}
  .name{font:800 76px Arial,Helvetica,sans-serif;fill:url(#nameGradient)}
  .surname{font:800 66px Arial,Helvetica,sans-serif;fill:#111}
  .tagline{font:700 25px Arial,Helvetica,sans-serif;fill:#30343a}
  .roleBox{fill:none;stroke:#d9dbe0;stroke-width:2}
  .devText{font:700 20px Arial,Helvetica,sans-serif;fill:#6246c7}
  .designText{font:700 20px Arial,Helvetica,sans-serif;fill:#e45b9d}
  .devIcon{fill:#6246c7}
  .designIcon{fill:none;stroke:#e45b9d;stroke-width:2.4}
  .dash{fill:#6246c7}
  @media (prefers-color-scheme:dark){
    .eyebrow{fill:#8b949e}
    .surname,.tagline{fill:#f0f6fc}
    .roleBox{stroke:#30363d}
    .devText{fill:#a78bfa}
    .designText{fill:#ff79b0}
    .devIcon{fill:#a78bfa}
    .designIcon{stroke:#ff79b0}
    .dash{fill:#58a6ff}
  }
</style>

<rect width="760" height="430" fill="none"/>

<text x="38" y="48" class="eyebrow">HI, I'M</text>

<!-- Ultra-compact shared role badge -->
<rect x="38" y="72" width="205" height="56" rx="28" class="roleBox"/>

<!-- Developer -->
<g>
  <g class="devIcon" transform="translate(72 100)">
    <path d="M-12-10L-22 0l10 10 3-3-7-7 7-7zM12-10L22 0 12 10l-3-3 7-7-7-7zM-2-14h5L2 14h-5z"/>
  </g>
  <text x="104" y="107" class="devText">Developer</text>
  <animate attributeName="opacity"
    values="0;1;1;1;.7;0;0"
    keyTimes="0;.08;.30;.38;.44;.52;1"
    dur="8s" repeatCount="indefinite"/>
</g>

<!-- Designer -->
<g opacity="0">
  <g class="designIcon" transform="translate(72 100)">
    <path d="M0-14c-9 0-16 6-16 14 0 7 5 12 12 12h4c2 0 4-2 4-4 0-2 1-4 4-4h4c6 0 8-4 8-8C20-9 11-14 0-14z"/>
    <circle cx="-7" cy="-3" r="1.8"/>
    <circle cx="0" cy="-7" r="1.8"/>
    <circle cx="7" cy="-4" r="1.8"/>
  </g>
  <text x="104" y="107" class="designText">Designer</text>
  <animate attributeName="opacity"
    values="0;0;0;.25;.7;1;1;.8;.25;0"
    keyTimes="0;.30;.40;.44;.48;.54;.78;.86;.94;1"
    dur="8s" repeatCount="indefinite"/>
</g>

<text x="38" y="207" class="name">Darshan</text>
<text x="122" y="278" class="surname">"Prajapati"</text>

<text x="38" y="332" class="tagline">
  Unleash Your Imagination<tspan class="dash"> –</tspan>
</text>

<rect x="39" y="370" width="34" height="4" rx="2" class="dash">
  <animate attributeName="width" values="18;34;18" dur="2.2s" repeatCount="indefinite"/>
</rect>
</svg>