<svg xmlns="http://www.w3.org/2000/svg" width="920" height="800" viewBox="0 0 920 800" role="img" aria-labelledby="title desc">
<title id="title">Tech Stack &amp; Tools — Darshan Prajapati</title>
<desc id="desc">Frontend, backend, tools, design and graphics technologies used by Darshan Prajapati.</desc>

<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6942c1"/>
    <stop offset="100%" stop-color="#2f81f7"/>
  </linearGradient>
  <style>
    .title{font:800 28px Arial,Helvetica,sans-serif;fill:#171b21}
    .section{font:700 18px Arial,Helvetica,sans-serif;fill:#252a31}
    .name{font:700 14px Arial,Helvetica,sans-serif;fill:#252a31}
    .muted{font:400 13px Arial,Helvetica,sans-serif;fill:#727b86}
    .card{fill:#fff;stroke:#e1e5ea;stroke-width:1.5}
    .pill{fill:#f7f8fa;stroke:#e2e6eb;stroke-width:1}
    .icon{font:700 16px Arial,Helvetica,sans-serif}
    .num{font:800 12px Arial,Helvetica,sans-serif;fill:#6942c1}
    @media (prefers-color-scheme:dark){
      .title{fill:#f0f6fc}
      .section,.name{fill:#e6edf3}
      .muted{fill:#8b949e}
      .card{fill:#161b22;stroke:#30363d}
      .pill{fill:#1c2128;stroke:#30363d}
      .num{fill:#58a6ff}
    }
  </style>
</defs>

