<svg xmlns="http://www.w3.org/2000/svg" width="185" height="48" viewBox="0 0 185 48" role="img" aria-labelledby="title">
<title>Instagram</title>
<style>
.bg{fill:#1c2229;stroke:#30363d}
.text{fill:#f0f6fc}
.ig{fill:none;stroke:#f0f6fc}
.dot{fill:#f0f6fc}
.line{fill:#58a6ff}
@media (prefers-color-scheme: light){
.bg{fill:#ffffff;stroke:#d0d7de}
.text{fill:#24292f}
.ig{stroke:#24292f}
.dot{fill:#24292f}
.line{fill:#1f6feb}
}
</style>
<rect x="1" y="1" width="183" height="46" rx="14" class="bg" stroke-width="2"/>
<g transform="translate(25 24)" class="ig" stroke-width="2.3">
  <rect x="-11" y="-11" width="22" height="22" rx="6"/>
  <circle r="5"/>
</g>
<circle cx="33" cy="16" r="1.8" class="dot"/>
<text x="52" y="29" class="text" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">INSTAGRAM</text>
<rect x="81" y="37" width="22" height="3.5" rx="1.75" class="line"/>
</svg>