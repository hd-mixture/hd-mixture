<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6246d8"/>
      <stop offset="100%" stop-color="#3478e5"/>
    </linearGradient>
    <style>
      .title { fill: #111827; }
      .body { fill: #334155; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #f0f6fc; }
        .body { fill: #c9d1d9; }
      }
    </style>
  </defs>

  <rect width="900" height="132" fill="transparent"/>

  <!-- Section heading -->
  <text x="18" y="38"
        font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif"
        font-size="24">💡</text>

  <text x="50" y="38"
        class="title"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23"
        font-weight="800">What I Like Building</text>

  <!-- Accent underline -->
  <rect x="18" y="52" width="82" height="3.5" rx="1.75"
        fill="url(#accent)"/>

  <!-- Content -->
  <text x="18" y="91"
        class="body"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="500">
    Interfaces that are clean, experiences that are useful, and projects that have a little bit of personality.
  </text>

  <text x="18" y="126"
        class="body"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="500">
    I enjoy combining development with visual thinking — not just making something work, but making it feel polished too.
  </text>
</svg>