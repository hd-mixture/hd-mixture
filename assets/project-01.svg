<svg xmlns="http://www.w3.org/2000/svg" width="420" height="215" viewBox="30 92 420 215">
<style>
    .title{font:800 28px Arial,Helvetica,sans-serif;fill:#171b21}
    .project{font:800 18px Arial,Helvetica,sans-serif;fill:#20252c}
    .desc{font:400 14px Arial,Helvetica,sans-serif;fill:#69737e}
    .focus{font:700 13px Arial,Helvetica,sans-serif;fill:#6942c1}
    .num{font:800 12px Arial,Helvetica,sans-serif;fill:#8a939d}
    .card{fill:#fff;stroke:#e1e5ea;stroke-width:1.5}
    .tag{fill:#f5f7fa;stroke:#e2e6eb;stroke-width:1}
    .tagtext{font:700 11px Arial,Helvetica,sans-serif;fill:#59636e}
.preview{fill:#fff;stroke:#2f81f7;stroke-width:1.4}
.previewtext{font:700 11px Arial,Helvetica,sans-serif;fill:#2f81f7}
    .accent{fill:url(#accent)}
    @media (prefers-color-scheme:dark){
      .title,.project{fill:#f0f6fc}
      .desc{fill:#8b949e}
      .focus{fill:#58a6ff}
      .num{fill:#6e7681}
      .card{fill:#161b22;stroke:#30363d}
      .tag{fill:#1c2128;stroke:#30363d}
      .tagtext{fill:#8b949e}
.preview{fill:#161b22;stroke:#58a6ff}
.previewtext{fill:#58a6ff}
    }
  </style>
<!-- 01 -->
<rect x="30" y="92" width="420" height="215" rx="18" class="card"/>
<text x="55" y="126" class="num">01</text>
<text x="90" y="126" class="project">🛡️ CyberAegXs</text>
<text x="55" y="162" class="desc">An AI-powered PDF Security and Management Platform</text>
<text x="55" y="184" class="desc">designed for secure and smart document handling.</text>
<rect x="55" y="217" width="70" height="30" rx="15" class="tag"/>
<text x="70" y="236" class="tagtext">React</text>
<rect x="133" y="217" width="70" height="30" rx="15" class="tag"/>
<text x="148" y="236" class="tagtext">Next.js</text>
<rect x="211" y="217" width="70" height="30" rx="15" class="tag"/>
<text x="226" y="236" class="tagtext">Node.js</text>
<rect x="55" y="255" width="70" height="30" rx="15" class="tag"/>
<text x="70" y="274" class="tagtext">Express</text>
<rect x="326" y="265" width="112" height="30" rx="15" class="preview"/>
  <text x="342" y="284" class="previewtext">↗ View Live</text>


</svg>