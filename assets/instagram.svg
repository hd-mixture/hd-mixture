<svg xmlns="http://www.w3.org/2000/svg" width="270" height="72" viewBox="0 0 270 72" role="img" aria-labelledby="title desc">
<title>Instagram</title>
<desc>Open Darshan's Instagram profile</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#24292f"/>
    <stop offset="1" stop-color="#161b22"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="268" height="70" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
<rect x="1" y="1" width="268" height="70" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".06"/>

<defs>
  <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#833ab4"/>
    <stop offset=".5" stop-color="#fd1d1d"/>
    <stop offset="1" stop-color="#fcb045"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="268" height="70" rx="20" fill="url(#ig)" opacity=".9"/>
<g transform="translate(34 36)" fill="none" stroke="#fff" stroke-width="3">
  <rect x="-15" y="-15" width="30" height="30" rx="8"/>
  <circle r="7"/>
</g>
<circle cx="44" cy="23" r="2.5" fill="#fff"/>
<text x="72" y="43" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">INSTAGRAM</text>

<rect x="120" y="58" width="30" height="4" rx="2" fill="#58a6ff"/>
</svg>